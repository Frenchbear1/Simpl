<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simpl</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img class="logo" src="icons/icon-32.png" alt="" width="24" height="24">
        <div>
          <h1>Simpl</h1>
          <p id="status">Checking this tab...</p>
        </div>
      </header>

      <section class="actions">
        <button id="togglePicker" class="primary" type="button">Pick Element</button>
        <button id="undoLast" type="button">Undo Last</button>
        <button id="openOptions" type="button">Manage Sites</button>
        <button id="clearSite" class="danger" type="button">Clear Site</button>
      </section>

      <button id="toggleAds" class="ad-toggle" type="button">Ad Filters On</button>

      <section class="youtube" aria-labelledby="youtubeHeading">
        <h2 id="youtubeHeading">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.76-1.77C18.27 5 12 5 12 5s-6.27 0-7.84.43A2.5 2.5 0 0 0 2.4 7.2C2 8.78 2 12 2 12s0 3.22.4 4.8a2.5 2.5 0 0 0 1.76 1.77C5.73 19 12 19 12 19s6.27 0 7.84-.43a2.5 2.5 0 0 0 1.76-1.77C22 15.22 22 12 22 12s0-3.22-.4-4.8zM10 15V9l5.2 3L10 15z"/></svg>
          YouTube viewer
        </h2>
        <label class="switch-row" for="youtubePreview">
          <span>
            <strong>Open videos in viewer</strong>
            <small>Click a video to watch it in a large preview instead of leaving the page.</small>
          </span>
          <input id="youtubePreview" type="checkbox" role="switch">
        </label>
        <label class="switch-row" for="youtubeAdFilters">
          <span>
            <strong>Ad filters on YouTube</strong>
            <small>Other websites keep their filters either way.</small>
          </span>
          <input id="youtubeAdFilters" type="checkbox" role="switch">
        </label>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
