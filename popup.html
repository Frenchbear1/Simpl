<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simpl</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Simpl</h1>
          <p id="status">Checking this tab...</p>
        </div>
      </header>

      <section class="actions">
        <button id="togglePicker" class="primary" type="button">Pick Element</button>
        <button id="undoLast" type="button">Undo Last</button>
        <button id="openOptions" type="button">Manage Sites</button>
        <button id="clearSite" class="danger" type="button">Clear Site</button>
      </section>

      <button id="toggleAds" class="ad-toggle" type="button">Ad Filters On</button>

    </main>

    <script src="popup.js"></script>
  </body>
</html>
